name: stepup_hub_mobile
description: StepUp Hub mobile app (Student / Teacher / Coordinator / Admin) - Phase 1
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  http_parser: ^4.1.2
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  intl: ^0.19.0
  google_fonts: ^6.2.1
  table_calendar: ^3.1.2
  file_picker: ^8.1.4
  image_picker: ^1.1.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
