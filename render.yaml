# Render Blueprint: Dashboard -> New + -> Blueprint -> pick this repo.
# Render asks only for the values marked "sync: false" (secrets are never stored in git).
services:
  - type: web
    name: stepup-hub-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: DB_URL
        value: jdbc:mysql://steup-hub-stepup-hub.a.aivencloud.com:23196/defaultdb?sslMode=REQUIRED&serverTimezone=UTC
      - key: DB_USERNAME
        value: avnadmin
      - key: DB_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DB_POOL_SIZE
        value: "5"
