server.port=${PORT:8080}
spring.application.name=stepup-hub-backend

# Local-only overrides (e.g. your MySQL password) live in backend/local.properties, which is
# gitignored so it never gets pushed. Deployed servers use environment variables instead.
spring.config.import=optional:file:./local.properties,optional:file:./backend/local.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/stepuphub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

app.jwt.secret=${JWT_SECRET:stepup-hub-local-dev-secret-key-change-in-production-0123456789}
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://10.0.2.2:8080
app.admin.seed-email=${ADMIN_EMAIL:admin@stepuphub.com}
app.admin.seed-password=${ADMIN_PASSWORD:Admin@123}
app.reminders.minutes-before-class=5

# File uploads (resumes, teacher intro videos, testimonial photos, site images, course curricula)
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Students/coordinators can open a class's meeting link this many minutes before it starts.
app.meeting.join-window-minutes=5
