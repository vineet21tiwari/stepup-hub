# Netlify: Add new site -> Import from Git -> pick this repo. No other settings needed.
[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Deployed backend (Render). Change here if Render gives the service a different URL.
  VITE_API_BASE_URL = "https://stepup-hub-api.onrender.com"
